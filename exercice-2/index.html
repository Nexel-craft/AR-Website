<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exercice 2 - AR.js et Marqueur Hiro</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="../assets/camera-switcher.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }
    video#arjs-video, .a-canvas {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important;
      margin: 0 !important;
      top: 0 !important;
      left: 0 !important;
    }
    .top-controls {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .panel {
      background: #ffffff;
      border: 1px solid #333;
      padding: 6px 10px;
      font-size: 13px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .btn {
      background: #eee;
      border: 1px solid #333;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover {
      background: #ddd;
    }
    a {
      color: #0056b3;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="top-controls">
    <div class="panel">
      <strong>Exercice 2</strong> : Viser Hiro (boite semi-transparente rotative). | 
      <a href="../index.html">Sommaire</a> | 
      <a href="../assets/HIRO.jpg" target="_blank">Voir Hiro</a>
    </div>
    <button id="btnSwitchCamera" class="btn" type="button">Changer de camera</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <!-- Boite semi-transparente qui tourne automatiquement -->
      <a-box 
        position="0 0.5 0" 
        color="#00bcd4" 
        material="opacity: 0.6; transparent: true;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      </a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
