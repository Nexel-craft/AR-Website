<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 45 0" scale="2 2 2" color="#4CC3D9"></a-box>
      <a-box position="0 1.25 -5" rotation="0 30 20" color="#EF2D5E"></a-box>
      <a-box position="1 0.75 -3" rotation="20 15 3" color="#FFC65D"></a-box>
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-entity 
        camera 
        look-controls 
        wasd-controls 
        position="0 10 15" 
        rotation="-30 0 0">
      </a-entity>
    </a-scene>
  </body>
</html>
