<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exercice 4 - Marqueur Personnalise .patt</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="../assets/camera-switcher.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    video#arjs-video {
      position: absolute !important;
      z-index: 1 !important;
    }

    .a-canvas {
      position: absolute !important;
      z-index: 2 !important;
    }

    .top-container {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      max-width: calc(100vw - 16px);
      box-sizing: border-box;
      pointer-events: none;
    }

    .panel {
      pointer-events: auto;
      background: #ffffff;
      border: 1px solid #333;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      max-width: 100%;
      box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
    }

    .camera-row {
      pointer-events: auto;
      max-width: 100%;
    }

    .btn {
      background: #eee;
      border: 1px solid #333;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      touch-action: manipulation;
      max-width: 100%;
      box-sizing: border-box;
      white-space: normal;
    }
    .btn:hover {
      background: #ddd;
    }
    a {
      color: #0056b3;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="top-container">
    <div class="panel">
      <strong>Exercice 4</strong> : Viser pattern-custom.patt (Torus Knot). | 
      <a href="../index.html">Sommaire</a> | 
      <a href="custom-marker.png" target="_blank">Voir marqueur</a>
    </div>
    <div class="camera-row">
      <button id="btnSwitchCamera" class="btn" type="button">Changer de camera</button>
    </div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker type="pattern" url="pattern-custom.patt">
      <a-torus-knot 
        position="0 0.6 0" 
        radius="0.4" 
        radius-tubular="0.07" 
        p="2" 
        q="3" 
        color="#f39c12" 
        material="roughness: 0.2; metalness: 0.8;"
        animation="property: rotation; to: 360 360 0; loop: true; dur: 5000; easing: linear">
      </a-torus-knot>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
