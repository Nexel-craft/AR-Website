<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exercice 4 - Marqueur Personnalise .patt</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="../assets/camera-switcher.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .top-controls {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .panel {
      background: #ffffff;
      border: 1px solid #333;
      padding: 6px 10px;
      font-size: 13px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .btn {
      background: #eee;
      border: 1px solid #333;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover {
      background: #ddd;
    }
    a {
      color: #0056b3;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="top-controls">
    <div class="panel">
      <strong>Exercice 4</strong> : Viser pattern-custom.patt (Torus Knot). | 
      <a href="../index.html">Sommaire</a> | 
      <a href="custom-marker.png" target="_blank">Voir pattern</a>
    </div>
    <button id="btnSwitchCamera" class="btn" type="button">Changer de camera</button>
    <button id="btnZoomOut" class="btn" type="button">Zoom -</button>
    <span id="zoomLevelText" class="panel" style="padding: 6px 8px; font-weight: bold;">1.0x</span>
    <button id="btnZoomIn" class="btn" type="button">Zoom +</button>
    <button id="btnFitMode" class="btn" type="button">Cadrage : Remplir</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
    <a-marker type="pattern" url="pattern-custom.patt">
      <!-- Objet 3D Torus Knot dore -->
      <a-torus-knot 
        position="0 0.6 0" 
        radius="0.4" 
        radius-tubular="0.07" 
        p="2" 
        q="3" 
        color="#f39c12" 
        material="roughness: 0.2; metalness: 0.8;"
        animation="property: rotation; to: 360 360 0; loop: true; dur: 5000; easing: linear">
      </a-torus-knot>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
