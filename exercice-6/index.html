<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exercice 6 - UI DOM Overlay</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="../assets/camera-switcher.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    video#arjs-video {
      position: absolute !important;
      z-index: 1 !important;
    }

    .a-canvas {
      position: absolute !important;
      z-index: 2 !important;
    }

    .top-container {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      max-width: calc(100vw - 16px);
      box-sizing: border-box;
      pointer-events: none;
    }

    .panel {
      pointer-events: auto;
      background: #ffffff;
      border: 1px solid #333;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      max-width: 100%;
      box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
    }

    .camera-row {
      pointer-events: auto;
      max-width: 100%;
    }

    .btn {
      background: #eee;
      border: 1px solid #333;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      touch-action: manipulation;
      max-width: 100%;
      box-sizing: border-box;
      white-space: normal;
    }
    .btn:hover {
      background: #ddd;
    }
    a {
      color: #0056b3;
      text-decoration: underline;
    }

    #hintText {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: #ffffff;
      border: 1px solid #333;
      padding: 8px 14px;
      font-size: 13px;
      max-width: calc(100vw - 32px);
      text-align: center;
      box-sizing: border-box;
    }

    #uiOverlay {
      display: none;
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 380px;
      z-index: 1000;
      background: #ffffff;
      border: 2px solid #333;
      padding: 12px 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }
    #uiOverlay h2 {
      margin: 0 0 10px 0;
      font-size: 14px;
    }
    .form-row {
      margin-bottom: 10px;
    }
    .form-row label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }
    input[type=range] {
      width: 100%;
    }
    .palette {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .palette span {
      font-size: 12px;
    }
    .color-btn {
      padding: 6px 10px;
      border: 1px solid #333;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="top-container">
    <div class="panel">
      <strong>Exercice 6</strong> : Viser Hiro pour afficher l'UI. | 
      <a href="../index.html">Sommaire</a> | 
      <a href="../assets/HIRO.jpg" target="_blank">Voir Hiro</a>
    </div>
    <div class="camera-row">
      <button id="btnSwitchCamera" class="btn" type="button">Changer de camera</button>
    </div>
  </div>

  <div id="hintText">Pointez la camera vers le marqueur Hiro pour afficher l'interface.</div>

  <div id="uiOverlay">
    <h2>Controle de la boite 3D</h2>
    
    <div class="form-row">
      <label>
        <span>Taille de la boite :</span>
        <span id="sizeVal">1.0</span>
      </label>
      <input type="range" id="sizeSlider" min="0.1" max="3.0" step="0.1" value="1.0">
    </div>

    <div class="palette">
      <span>Couleur :</span>
      <button type="button" class="color-btn" data-color="#e74c3c" style="background: #e74c3c;">Rouge</button>
      <button type="button" class="color-btn" data-color="#2ecc71" style="background: #2ecc71;">Vert</button>
      <button type="button" class="color-btn" data-color="#3498db" style="background: #3498db;">Bleu</button>
      <button type="button" class="color-btn" data-color="#f1c40f" style="background: #f39c12;">Jaune</button>
    </div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker id="hiroMarker" preset="hiro">
      <a-box 
        id="boxTarget" 
        position="0 0.5 0" 
        scale="1 1 1"
        color="#e74c3c" 
        material="opacity: 0.9;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
      </a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const marker = document.getElementById('hiroMarker');
      const box = document.getElementById('boxTarget');
      const uiOverlay = document.getElementById('uiOverlay');
      const hintText = document.getElementById('hintText');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeVal = document.getElementById('sizeVal');
      const colorBtns = document.querySelectorAll('.color-btn');

      marker.addEventListener('markerFound', function () {
        uiOverlay.style.display = 'block';
        hintText.style.display = 'none';
      });

      marker.addEventListener('markerLost', function () {
        uiOverlay.style.display = 'none';
        hintText.style.display = 'block';
      });

      sizeSlider.addEventListener('input', function (e) {
        const val = parseFloat(e.target.value);
        box.setAttribute('scale', `${val} ${val} ${val}`);
        box.setAttribute('position', `0 ${val / 2} 0`);
        sizeVal.textContent = val.toFixed(1);
      });

      colorBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          const color = btn.dataset.color;
          box.setAttribute('material', 'color', color);
        });
      });
    });
  </script>

</body>
</html>
