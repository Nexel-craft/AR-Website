<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exercice 6 - UI DOM Overlay Dynamique en AR</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Message d'aide flottant supérieur */
    .top-bar {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-badge {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 20px;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
    }
    .status-dot.found {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    .hub-link {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      color: #38bdf8;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Indicateur guidant l'utilisateur à viser le marqueur */
    #hintOverlay {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      color: #cbd5e1;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      pointer-events: auto;
    }
    #hintOverlay a {
      color: #38bdf8;
      font-weight: bold;
      text-decoration: underline;
    }

    /* 
      PANNEAU DE CONTRÔLE DOM OVERLAY
      Masqué par défaut (display: none), visible uniquement quand markerFound est déclenché
    */
    #controlsOverlay {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 16px 20px;
      color: #ffffff;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      box-sizing: border-box;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translate(-50%, 20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    .ui-title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      margin: 0 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Section Slider */
    .slider-group {
      margin-bottom: 14px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .slider-val {
      color: #38bdf8;
      font-weight: 700;
    }
    input[type=range] {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* Section Palette */
    .palette-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .palette-label {
      font-size: 12px;
      color: #cbd5e1;
    }
    .color-buttons {
      display: flex;
      gap: 10px;
    }
    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      outline: none;
    }
    .color-btn:active, .color-btn.active {
      transform: scale(1.2);
      border-color: #ffffff;
      box-shadow: 0 0 12px currentColor;
    }

    /* Modal Marqueur */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal img { max-width: 260px; width: 80%; background: white; padding: 10px; border-radius: 8px; }
    .modal button { margin-top: 15px; padding: 8px 18px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Barre supérieure de statut -->
  <div class="top-bar">
    <div class="top-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Viser le marqueur Hiro</span>
    </div>
    <a href="../index.html" class="hub-link">← Hub</a>
  </div>

  <!-- Message d'incitation quand le marqueur n'est pas encore détecté -->
  <div id="hintOverlay">
    Pointez vers le marqueur Hiro pour activer les contrôles.<br>
    <a href="#" onclick="document.getElementById('markerModal').classList.add('active'); return false;">Afficher Hiro à l'écran</a>
  </div>

  <!-- 
    INTERFACE UTILISATEUR HTML (DOM Overlay)
    Affichée uniquement lors de la détection du marqueur Hiro
  -->
  <div id="controlsOverlay">
    <div class="ui-title">
      <span>🎛️ Contrôle de l'Objet AR</span>
      <span style="font-size: 11px; color: #22c55e;">● Connecté</span>
    </div>

    <!-- 1. Slider pour la taille de 0.1 à 3.0 unités -->
    <div class="slider-group">
      <div class="slider-header">
        <span>Taille de la boîte (Échelle)</span>
        <span id="scaleDisplay" class="slider-val">1.0 unité</span>
      </div>
      <input type="range" id="scaleSlider" min="0.1" max="3.0" step="0.1" value="1.0">
    </div>

    <!-- 2. Palette de couleurs : Rouge, Vert, Bleu (+ Jaune et Violet) -->
    <div class="palette-group">
      <span class="palette-label">Palette :</span>
      <div class="color-buttons">
        <button class="color-btn active" data-color="#ef4444" style="background: #ef4444;" title="Rouge"></button>
        <button class="color-btn" data-color="#10b981" style="background: #10b981;" title="Vert"></button>
        <button class="color-btn" data-color="#3b82f6" style="background: #3b82f6;" title="Bleu"></button>
        <button class="color-btn" data-color="#f59e0b" style="background: #f59e0b;" title="Jaune"></button>
        <button class="color-btn" data-color="#8b5cf6" style="background: #8b5cf6;" title="Violet"></button>
      </div>
    </div>
  </div>

  <!-- Modal Marqueur Hiro -->
  <div id="markerModal" class="modal">
    <img src="../assets/HIRO.jpg" alt="Marqueur Hiro">
    <p style="color: #cbd5e1; font-size: 13px; margin-top: 10px;">Scannez avec votre téléphone</p>
    <button onclick="document.getElementById('markerModal').classList.remove('active')">Fermer</button>
  </div>

  <!-- Scène AR.js -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;">
    
    <!-- Marqueur Hiro avec identifiant pour les événements JS -->
    <a-marker id="hiroMarker" preset="hiro">
      
      <!-- Boîte personnalisable 3D -->
      <a-box 
        id="arBox" 
        position="0 0.5 0" 
        scale="1 1 1"
        color="#ef4444" 
        material="roughness: 0.25; metalness: 0.5; opacity: 0.9;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
        <!-- Arêtes géométriques -->
        <a-box wireframe="true" color="#ffffff" scale="1.01 1.01 1.01"></a-box>
      </a-box>

      <!-- Anneau de base -->
      <a-ring rotation="-90 0 0" radius-inner="0.6" radius-outer="0.75" color="#38bdf8" material="opacity: 0.5"></a-ring>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <!-- Script d'interaction DOM Overlay et synchronisation AR -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const marker = document.getElementById('hiroMarker');
      const box = document.getElementById('arBox');
      const controlsOverlay = document.getElementById('controlsOverlay');
      const hintOverlay = document.getElementById('hintOverlay');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      
      const scaleSlider = document.getElementById('scaleSlider');
      const scaleDisplay = document.getElementById('scaleDisplay');
      const colorBtns = document.querySelectorAll('.color-btn');

      // 1. Événement markerFound : le marqueur Hiro entre dans le champ de la caméra
      marker.addEventListener('markerFound', () => {
        controlsOverlay.style.display = 'block';
        hintOverlay.style.display = 'none';
        statusDot.classList.add('found');
        statusText.textContent = 'Marqueur Hiro détecté !';
      });

      // 2. Événement markerLost : le marqueur Hiro sort du champ de la caméra
      marker.addEventListener('markerLost', () => {
        controlsOverlay.style.display = 'none';
        hintOverlay.style.display = 'block';
        statusDot.classList.remove('found');
        statusText.textContent = 'Viser le marqueur Hiro';
      });

      // 3. Modification en temps réel de l'échelle via le slider (0.1 à 3.0)
      scaleSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        // Mise à jour de l'échelle 3D de la boîte
        box.setAttribute('scale', `${val} ${val} ${val}`);
        // Ajustement automatique de la hauteur Y pour garder la boîte posée sur le marqueur
        box.setAttribute('position', `0 ${val / 2} 0`);
        // Mise à jour de l'affichage textuel
        scaleDisplay.textContent = `${val.toFixed(1)} unité${val > 1 ? 's' : ''}`;
      });

      // 4. Modification immédiate de la couleur lors du clic sur la palette
      colorBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          colorBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const selectedColor = btn.dataset.color;
          box.setAttribute('material', 'color', selectedColor);
        });
      });
    });
  </script>

</body>
</html>
