<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exercice 3 - Interaction Clic et Tap</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="../assets/camera-switcher.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .top-controls {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .panel {
      background: #ffffff;
      border: 1px solid #333;
      padding: 6px 10px;
      font-size: 13px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .btn {
      background: #eee;
      border: 1px solid #333;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover {
      background: #ddd;
    }
    a {
      color: #0056b3;
      text-decoration: underline;
    }
  </style>

  <script>
    AFRAME.registerComponent('interactive-box', {
      init: function () {
        const el = this.el;
        const colors = ['#e74c3c', '#2ecc71', '#3498db', '#f1c40f', '#9b59b6'];
        let colorIndex = 0;
        let isFast = false;
        const statusEl = document.getElementById('statusText');

        el.addEventListener('click', function () {
          colorIndex = (colorIndex + 1) % colors.length;
          const nextColor = colors[colorIndex];
          el.setAttribute('material', 'color', nextColor);

          isFast = !isFast;
          el.setAttribute('animation__spin', {
            property: 'rotation',
            to: '0 360 0',
            loop: true,
            dur: isFast ? 800 : 3500,
            easing: 'linear'
          });

          el.setAttribute('animation__scale', {
            property: 'scale',
            to: isFast ? '1.3 1.3 1.3' : '1.0 1.0 1.0',
            dur: 300,
            easing: 'easeOutElastic'
          });

          if (statusEl) {
            statusEl.textContent = `Vitesse : ${isFast ? 'Rapide' : 'Normale'} | Couleur : ${nextColor}`;
          }
        });
      }
    });
  </script>
</head>
<body>

  <div class="top-controls">
    <div class="panel">
      <strong>Exercice 3</strong> : Cliquer ou taper sur la boite pour changer couleur et rotation. | 
      <span id="statusText">En attente d'interaction</span> | 
      <a href="../index.html">Sommaire</a>
    </div>
    <button id="btnSwitchCamera" class="btn" type="button">Changer de camera</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <a-box 
        id="targetBox"
        class="clickable"
        position="0 0.5 0" 
        color="#3498db" 
        material="opacity: 0.8; transparent: true;"
        animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 3500; easing: linear"
        interactive-box>
      </a-box>
    </a-marker>

    <!-- Curseur reticule et raycaster tactile pour mobile et desktop -->
    <a-entity camera>
      <a-cursor fuse="false" color="#00ffff" raycaster="objects: .clickable"></a-cursor>
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-entity>
  </a-scene>

</body>
</html>
