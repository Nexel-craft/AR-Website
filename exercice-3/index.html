<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exercice 3 - Interaction Clic et Tap</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="../assets/camera-switcher.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000; /* Fond noir pour les barres de cadrage natif */
      user-select: none;
      -webkit-user-select: none;
    }

    /* Le cadrage synchronise au pixel pres est pilote par camera-switcher.js */
    video#arjs-video, .a-canvas {
      position: absolute !important;
    }

    /* Conteneur superieur qui reste toujours 100% visible a l'ecran */
    .top-container {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      max-width: calc(100vw - 16px);
      box-sizing: border-box;
      pointer-events: none;
    }

    .panel {
      pointer-events: auto;
      background: #ffffff;
      border: 1px solid #333;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      max-width: 100%;
      box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
    }

    .camera-row {
      pointer-events: auto;
      max-width: 100%;
    }

    .btn {
      background: #eee;
      border: 1px solid #333;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      touch-action: manipulation;
      max-width: 100%;
      box-sizing: border-box;
      white-space: normal;
    }
    .btn:hover {
      background: #ddd;
    }
    a {
      color: #0056b3;
      text-decoration: underline;
    }
    #statusText {
      font-weight: bold;
      color: #0056b3;
    }

    /* Figure affichant la zone de clic en noir a 20% de transparence */
    #clickZoneBox {
      position: fixed;
      background-color: rgba(0, 0, 0, 0.2);
      border: 2px dashed rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      z-index: 995;
      display: none;
      box-sizing: border-box;
      cursor: pointer;
    }
  </style>

  <script>
    AFRAME.registerComponent('dynamic-spin', {
      schema: {
        speed: { type: 'number', default: 1.0 }
      },
      init: function () {
        this.currentSpeed = this.data.speed;
      },
      update: function () {
        this.currentSpeed = this.data.speed;
      },
      tick: function (time, timeDelta) {
        if (!this.el.object3D) return;
        this.el.object3D.rotation.y += (timeDelta / 1000) * this.currentSpeed;
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      const scene = document.querySelector('a-scene');
      const box = document.getElementById('targetBox');
      const statusEl = document.getElementById('statusText');
      const clickZone = document.getElementById('clickZoneBox');
      const colors = ['#e74c3c', '#2ecc71', '#9b59b6', '#f1c40f', '#e67e22', '#00bcd4', '#e91e63'];
      
      let colorIndex = 0;
      let isFast = false;
      let lastTrigger = 0;

      function triggerBoxInteraction() {
        const now = Date.now();
        if (now - lastTrigger < 250) return;
        lastTrigger = now;

        const target = document.getElementById('targetBox');
        if (!target) return;

        colorIndex = (colorIndex + 1) % colors.length;
        const nextColor = colors[colorIndex];
        target.setAttribute('material', 'color', nextColor);

        isFast = !isFast;
        const newSpeed = isFast ? 6.0 : 1.0;
        target.setAttribute('dynamic-spin', 'speed', newSpeed);

        const targetScale = isFast ? '1.6 1.6 1.6' : '1.0 1.0 1.0';
        target.setAttribute('animation__scale', {
          property: 'scale',
          to: targetScale,
          dur: 300,
          easing: 'easeOutBack'
        });

        if (navigator.vibrate) {
          try { navigator.vibrate(50); } catch(e) {}
        }

        if (statusEl) {
          statusEl.textContent = `Touche ! Vitesse: ${isFast ? 'Rapide (6x)' : 'Normale (1x)'} | Couleur: ${nextColor}`;
        }
      }

      clickZone.addEventListener('click', triggerBoxInteraction);
      clickZone.addEventListener('touchstart', function(e) {
        e.preventDefault();
        triggerBoxInteraction();
      }, { passive: false });

      if (box) {
        box.addEventListener('click', triggerBoxInteraction);
      }

      // Mise a jour en temps reel de la zone de clic alignee sur le viewport effectif
      function updateClickZone() {
        requestAnimationFrame(updateClickZone);
        if (!scene || !scene.camera) return;
        const camera = scene.camera;
        const marker = document.querySelector('a-marker');
        const target = document.getElementById('targetBox');

        if (!marker || !marker.object3D || !marker.object3D.visible || !target || !target.object3D) {
          clickZone.style.display = 'none';
          return;
        }

        scene.object3D.updateMatrixWorld(true);
        camera.updateMatrixWorld(true);

        // Recupere le rectangle video reel affiche (sans rognage)
        const vp = window.getARViewport ? window.getARViewport() : {
          width: window.innerWidth,
          height: window.innerHeight,
          left: 0,
          top: 0
        };

        const h = 0.55;
        const corners = [
          new THREE.Vector3(-h, -h, -h),
          new THREE.Vector3( h, -h, -h),
          new THREE.Vector3(-h,  h, -h),
          new THREE.Vector3( h,  h, -h),
          new THREE.Vector3(-h, -h,  h),
          new THREE.Vector3( h, -h,  h),
          new THREE.Vector3(-h,  h,  h),
          new THREE.Vector3( h,  h,  h)
        ];

        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        let inFront = false;

        for (let i = 0; i < 8; i++) {
          const v = corners[i].clone();
          v.applyMatrix4(target.object3D.matrixWorld);
          v.project(camera);

          if (v.z < 1) inFront = true;

          const sx = vp.left + ((v.x + 1) / 2) * vp.width;
          const sy = vp.top + ((-v.y + 1) / 2) * vp.height;

          if (sx < minX) minX = sx;
          if (sx > maxX) maxX = sx;
          if (sy < minY) minY = sy;
          if (sy > maxY) maxY = sy;
        }

        if (!inFront || maxX <= minX || maxY <= minY) {
          clickZone.style.display = 'none';
          return;
        }

        const padding = 10;
        let boxW = (maxX - minX) + 2 * padding;
        let boxH = (maxY - minY) + 2 * padding;
        let boxL = minX - padding;
        let boxT = minY - padding;

        clickZone.style.display = 'block';
        clickZone.style.left = Math.round(boxL) + 'px';
        clickZone.style.top = Math.round(boxT) + 'px';
        clickZone.style.width = Math.round(boxW) + 'px';
        clickZone.style.height = Math.round(boxH) + 'px';
      }

      requestAnimationFrame(updateClickZone);

      function checkGlobalPointer(clientX, clientY, targetElem) {
        if (targetElem && targetElem.closest && targetElem.closest('.top-container')) return;
        if (clickZone.style.display !== 'none') {
          const rect = clickZone.getBoundingClientRect();
          if (clientX >= rect.left && clientX <= rect.right &&
              clientY >= rect.top && clientY <= rect.bottom) {
            triggerBoxInteraction();
          }
        }
      }

      window.addEventListener('pointerdown', function (e) {
        checkGlobalPointer(e.clientX, e.clientY, e.target);
      }, true);

      window.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length > 0) {
          checkGlobalPointer(e.touches[0].clientX, e.touches[0].clientY, e.target);
        }
      }, { passive: true });
    });
  </script>
</head>
<body>

  <!-- Figure matérialisant la zone de clic en noir à 20% de transparence -->
  <div id="clickZoneBox" title="Zone de clic"></div>

  <!-- Conteneur banniere et bouton camera sous la banniere -->
  <div class="top-container">
    <div class="panel">
      <strong>Exercice 3</strong> : Taper sur le cube ou la zone de clic. | 
      <span id="statusText">En attente de detection Hiro</span> | 
      <a href="../index.html">Sommaire</a>
    </div>
    <div class="camera-row">
      <button id="btnSwitchCamera" class="btn" type="button">Changer de camera</button>
    </div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <a-box 
        id="targetBox"
        class="clickable"
        position="0 0.5 0" 
        scale="1 1 1"
        color="#e74c3c" 
        material="opacity: 0.85; transparent: true;"
        dynamic-spin="speed: 1.0">
      </a-box>
    </a-marker>

    <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
  </a-scene>

</body>
</html>
