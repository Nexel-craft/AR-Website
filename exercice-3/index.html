<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exercice 3 - Interaction Clic et Tap</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="../assets/camera-switcher.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }
    /* Force l'affichage du flux natif sans aucun rognage (lettrage noir si ratio different) */
    video#arjs-video, .a-canvas {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important;
      margin: 0 !important;
      top: 0 !important;
      left: 0 !important;
    }
    .top-controls {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .panel {
      background: #ffffff;
      border: 1px solid #333;
      padding: 6px 10px;
      font-size: 13px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .btn {
      background: #eee;
      border: 1px solid #333;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover {
      background: #ddd;
    }
    a {
      color: #0056b3;
      text-decoration: underline;
    }
    #statusText {
      font-weight: bold;
      color: #0056b3;
    }
  </style>

  <script>
    // Composant de rotation en boucle continue a vitesse modulable
    AFRAME.registerComponent('rotator', {
      schema: {
        speed: { type: 'number', default: 1.0 }
      },
      tick: function (time, timeDelta) {
        if (!this.el.object3D) return;
        this.el.object3D.rotation.y += (timeDelta / 1000) * this.data.speed;
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      const scene = document.querySelector('a-scene');
      const box = document.getElementById('targetBox');
      const statusEl = document.getElementById('statusText');
      const colors = ['#e74c3c', '#2ecc71', '#3498db', '#f1c40f', '#9b59b6', '#e67e22', '#00bcd4'];
      
      let colorIndex = 0;
      let isFast = false;
      let lastTrigger = 0;

      // Déclenchement de l'interaction demandée par la consigne
      function triggerInteraction() {
        const now = Date.now();
        if (now - lastTrigger < 250) return;
        lastTrigger = now;

        const target = document.getElementById('targetBox');
        if (!target) return;

        // 1. Changement de couleur
        colorIndex = (colorIndex + 1) % colors.length;
        const nextColor = colors[colorIndex];
        target.setAttribute('material', 'color', nextColor);

        // 2. Animation supplémentaire : tourne plus vite (1x -> 5x) et pulse d'échelle
        isFast = !isFast;
        target.setAttribute('rotator', 'speed', isFast ? 5.0 : 1.0);
        target.setAttribute('animation__scale', {
          property: 'scale',
          to: isFast ? '1.5 1.5 1.5' : '1.0 1.0 1.0',
          dur: 300,
          easing: 'easeOutBack'
        });

        if (statusEl) {
          statusEl.textContent = `Touche ! Vitesse: ${isFast ? 'Rapide (5x)' : 'Normale (1x)'} | Couleur: ${nextColor}`;
        }
      }

      // Écouteur de clic direct A-Frame
      if (box) {
        box.addEventListener('click', triggerInteraction);
      }

      // Détection universelle clic (desktop) et tap (mobile)
      function checkTouchTarget(clientX, clientY) {
        if (!scene || !scene.camera) return;
        const camera = scene.camera;
        const target = document.getElementById('targetBox');
        const marker = document.querySelector('a-marker');
        if (!target || !target.object3D || !marker || !marker.object3D || !marker.object3D.visible) return;

        target.object3D.updateMatrixWorld(true);

        // Projection 2D du cube pour valider le tap sur mobile et PC
        const center = new THREE.Vector3();
        target.object3D.getWorldPosition(center);
        center.project(camera);

        if (center.z > 1) return; // Derrière la caméra

        const screenX = ((center.x + 1) / 2) * window.innerWidth;
        const screenY = ((-center.y + 1) / 2) * window.innerHeight;

        // Distance entre le point touché et le centre du cube à l'écran
        const dist = Math.hypot(clientX - screenX, clientY - screenY);
        
        // Rayon tactile adapté (au moins 80px)
        if (dist < 90) {
          triggerInteraction();
          return;
        }

        // Raycaster 3D complémentaire
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        if (raycaster.intersectObjects([target.object3D], true).length > 0) {
          triggerInteraction();
        }
      }

      function handleInput(clientX, clientY, targetElem) {
        if (targetElem && targetElem.closest && targetElem.closest('.top-controls')) return;
        checkTouchTarget(clientX, clientY);
      }

      window.addEventListener('pointerdown', function (e) {
        handleInput(e.clientX, e.clientY, e.target);
      }, true);

      window.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length > 0) {
          handleInput(e.touches[0].clientX, e.touches[0].clientY, e.target);
        }
      }, { passive: true });
    });
  </script>
</head>
<body>

  <div class="top-controls">
    <div class="panel">
      <strong>Exercice 3</strong> : Taper ou cliquer sur la boite. | 
      <span id="statusText">En attente de detection Hiro</span> | 
      <a href="../index.html">Sommaire</a>
    </div>
    <button id="btnSwitchCamera" class="btn" type="button">Changer de camera</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <!-- Boite interactive de l'Exercice 2 -->
      <a-box 
        id="targetBox"
        class="clickable"
        position="0 0.5 0" 
        scale="1 1 1"
        color="#e74c3c" 
        material="opacity: 0.85; transparent: true;"
        rotator="speed: 1.0">
      </a-box>
    </a-marker>

    <!-- Curseur associe a la camera pour le raycasting de base (consigne) -->
    <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
  </a-scene>

</body>
</html>
