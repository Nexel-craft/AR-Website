<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exercice 3 - Interaction Clic / Tap en Réalité Augmentée</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    .ar-overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      pointer-events: none;
    }

    .card {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      max-width: 440px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .card h1 {
      margin: 0 0 6px 0;
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
    }

    .card p {
      margin: 0 0 10px 0;
      font-size: 12px;
      line-height: 1.4;
      color: #cbd5e1;
    }

    .badge-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .links {
      display: flex;
      gap: 12px;
      font-size: 12px;
    }

    .links a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal img {
      max-width: 280px;
      width: 80%;
      border-radius: 8px;
      background: white;
      padding: 10px;
    }
    .modal button {
      margin-top: 15px;
      padding: 8px 18px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>

  <script>
    /**
     * Composant personnalisé d'interaction pour la boîte
     * Gère le clic (desktop) et le tap tactile (mobile)
     */
    AFRAME.registerComponent('interactive-box', {
      init: function () {
        const el = this.el;
        const colors = ['#ef4444', '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
        let colorIdx = 0;
        let isFast = false;
        let clickCount = 0;

        const statusEl = document.getElementById('clickStatus');

        el.addEventListener('click', function (evt) {
          // Vibration haptique sur smartphone si supportée
          if (navigator.vibrate) {
            navigator.vibrate(40);
          }

          // 1. Changement cyclique de couleur
          colorIdx = (colorIdx + 1) % colors.length;
          const nextColor = colors[colorIdx];
          el.setAttribute('material', 'color', nextColor);

          // 2. Bascule d'accélération de rotation et d'échelle
          isFast = !isFast;
          clickCount++;

          // Met à jour l'animation de rotation : durée 800ms (rapide) ou 3500ms (normale)
          el.setAttribute('animation__spin', {
            property: 'rotation',
            to: '0 360 0',
            loop: true,
            dur: isFast ? 800 : 3500,
            easing: 'linear'
          });

          // Animation d'impact sur l'échelle (pulse/rebond)
          el.setAttribute('animation__scale', {
            property: 'scale',
            to: isFast ? '1.3 1.3 1.3' : '1.0 1.0 1.0',
            dur: 300,
            easing: 'easeOutElastic'
          });

          // Mise à jour de l'affichage dans l'interface
          if (statusEl) {
            statusEl.textContent = `Interactions : ${clickCount} | Vitesse : ${isFast ? '⚡ Rapide' : 'Normal'} | Couleur : ${nextColor}`;
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- Superposition HTML UI -->
  <div class="ar-overlay">
    <div class="card">
      <h1>👆 Exercice 3 : Clic & Tap Tactile</h1>
      <p>Pointez le marqueur <strong>HIRO</strong>, puis tapez sur la boîte (sur mobile) ou cliquez dessus (curseur / souris sur PC).</p>
      <div id="clickStatus" class="badge-status">En attente de détection du marqueur...</div>
      <div class="links">
        <a href="../index.html">← Hub</a>
        <a href="#" onclick="document.getElementById('markerModal').classList.add('active'); return false;">Afficher Marqueur Hiro</a>
      </div>
    </div>
  </div>

  <div id="markerModal" class="modal">
    <img src="../assets/HIRO.jpg" alt="Marqueur Hiro">
    <p style="color: #cbd5e1; font-size: 13px; margin-top: 10px;">Scannez avec un second appareil</p>
    <button onclick="document.getElementById('markerModal').classList.remove('active')">Fermer</button>
  </div>

  <!-- Scène AR.js -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;">
    
    <a-marker preset="hiro">
      <!--
        Boîte interactive :
        - class="clickable" : cible filtrée pour le raycaster
        - interactive-box : notre composant JS qui écoute l'événement click
        - animation__spin : rotation initiale douce
      -->
      <a-box 
        id="targetBox"
        class="clickable"
        position="0 0.6 0" 
        scale="1 1 1"
        color="#3b82f6" 
        material="opacity: 0.75; transparent: true; roughness: 0.3; metalness: 0.4;"
        animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 3500; easing: linear"
        interactive-box>
        
        <!-- Contours en fil de fer -->
        <a-box wireframe="true" color="#ffffff" scale="1.03 1.03 1.03"></a-box>
      </a-box>

      <a-ring rotation="-90 0 0" radius-inner="0.65" radius-outer="0.75" color="#ffffff" material="opacity: 0.4"></a-ring>
    </a-marker>

    <!--
      Caméra avec double système de ciblage :
      1. Curseur réticule visible au centre : <a-cursor>
      2. Raycaster tactile / souris : rayOrigin: mouse permet de taper n'importe où sur la boîte à l'écran du smartphone !
    -->
    <a-entity camera>
      <a-cursor 
        fuse="false"
        color="#38bdf8" 
        scale="0.8 0.8 0.8"
        raycaster="objects: .clickable">
      </a-cursor>
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-entity>

  </a-scene>

</body>
</html>
