<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exercice 3 - Interaction Clic et Tap</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="../assets/camera-switcher.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .top-controls {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      touch-action: manipulation;
    }
    .panel {
      background: #ffffff;
      border: 1px solid #333;
      padding: 6px 10px;
      font-size: 13px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .btn {
      background: #eee;
      border: 1px solid #333;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      touch-action: manipulation;
    }
    .btn:hover {
      background: #ddd;
    }
    a {
      color: #0056b3;
      text-decoration: underline;
    }
    #statusText {
      font-weight: bold;
      color: #0056b3;
    }

    /* Figure affichant la zone de clic en noir à 20% de transparence */
    #clickZoneBox {
      position: fixed;
      background-color: rgba(0, 0, 0, 0.2); /* Noir a 20% de transparence */
      border: 2px dashed rgba(0, 0, 0, 0.6);
      pointer-events: auto; /* Permet de cliquer/taper directement sur la zone */
      z-index: 995;
      display: none;
      box-sizing: border-box;
      cursor: pointer;
    }
  </style>

  <script>
    // Composant de rotation dynamique en boucle continue
    AFRAME.registerComponent('dynamic-spin', {
      schema: {
        speed: { type: 'number', default: 1.0 }
      },
      init: function () {
        this.currentSpeed = this.data.speed;
      },
      update: function () {
        this.currentSpeed = this.data.speed;
      },
      tick: function (time, timeDelta) {
        if (!this.el.object3D) return;
        this.el.object3D.rotation.y += (timeDelta / 1000) * this.currentSpeed;
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      const scene = document.querySelector('a-scene');
      const box = document.getElementById('targetBox');
      const statusEl = document.getElementById('statusText');
      const clickZone = document.getElementById('clickZoneBox');
      const colors = ['#e74c3c', '#2ecc71', '#9b59b6', '#f1c40f', '#e67e22', '#00bcd4', '#e91e63'];
      
      let colorIndex = 0;
      let isFast = false;
      let lastTrigger = 0;

      // Déclenchement de l'interaction (changement couleur, vitesse et échelle)
      function triggerBoxInteraction() {
        const now = Date.now();
        if (now - lastTrigger < 250) return; // Anti-rebond
        lastTrigger = now;

        const target = document.getElementById('targetBox');
        if (!target) return;

        // 1. Couleur
        colorIndex = (colorIndex + 1) % colors.length;
        const nextColor = colors[colorIndex];
        target.setAttribute('material', 'color', nextColor);

        // 2. Vitesse de rotation (1x -> 6x)
        isFast = !isFast;
        const newSpeed = isFast ? 6.0 : 1.0;
        target.setAttribute('dynamic-spin', 'speed', newSpeed);

        // 3. Échelle (pulse a 1.6x)
        const targetScale = isFast ? '1.6 1.6 1.6' : '1.0 1.0 1.0';
        target.setAttribute('animation__scale', {
          property: 'scale',
          to: targetScale,
          dur: 300,
          easing: 'easeOutBack'
        });

        // 4. Vibration mobile si supportée
        if (navigator.vibrate) {
          try { navigator.vibrate(50); } catch(e) {}
        }

        // 5. Statut
        if (statusEl) {
          statusEl.textContent = `Touche ! Vitesse: ${isFast ? 'Rapide (6x)' : 'Normale (1x)'} | Couleur: ${nextColor}`;
        }
      }

      // Clic direct sur la zone noire semi-transparente
      clickZone.addEventListener('click', triggerBoxInteraction);
      clickZone.addEventListener('touchstart', function(e) {
        e.preventDefault();
        triggerBoxInteraction();
      }, { passive: false });

      // Écouteur de clic A-Frame sur l'entité boîte
      if (box) {
        box.addEventListener('click', triggerBoxInteraction);
      }

      // Calcul et affichage en temps réel de la zone de clic (noir à 20% d'opacité)
      function updateClickZone() {
        requestAnimationFrame(updateClickZone);
        if (!scene || !scene.camera) return;
        const camera = scene.camera;
        const marker = document.querySelector('a-marker');
        const target = document.getElementById('targetBox');

        if (!marker || !marker.object3D || !marker.object3D.visible || !target || !target.object3D) {
          clickZone.style.display = 'none';
          return;
        }

        // Met à jour les matrices mondes pour la projection
        scene.object3D.updateMatrixWorld(true);
        camera.updateMatrixWorld(true);

        const h = 0.55;
        const corners = [
          new THREE.Vector3(-h, -h, -h),
          new THREE.Vector3( h, -h, -h),
          new THREE.Vector3(-h,  h, -h),
          new THREE.Vector3( h,  h, -h),
          new THREE.Vector3(-h, -h,  h),
          new THREE.Vector3( h, -h,  h),
          new THREE.Vector3(-h,  h,  h),
          new THREE.Vector3( h,  h,  h)
        ];

        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        let inFront = false;

        const w = window.innerWidth;
        const hWin = window.innerHeight;

        for (let i = 0; i < 8; i++) {
          const v = corners[i].clone();
          v.applyMatrix4(target.object3D.matrixWorld);
          v.project(camera);

          if (v.z < 1) inFront = true;

          const sx = ((v.x + 1) / 2) * w;
          const sy = ((-v.y + 1) / 2) * hWin;

          if (sx < minX) minX = sx;
          if (sx > maxX) maxX = sx;
          if (sy < minY) minY = sy;
          if (sy > maxY) maxY = sy;
        }

        if (!inFront || maxX <= minX || maxY <= minY) {
          clickZone.style.display = 'none';
          return;
        }

        // Calibre la zone avec une taille minimale confortable (évite les zones minuscules sur Firefox)
        const padding = 15;
        let boxW = (maxX - minX) + 2 * padding;
        let boxH = (maxY - minY) + 2 * padding;
        let boxL = minX - padding;
        let boxT = minY - padding;

        const minTouchSize = 95;
        if (boxW < minTouchSize) {
          const diff = minTouchSize - boxW;
          boxL -= diff / 2;
          boxW = minTouchSize;
        }
        if (boxH < minTouchSize) {
          const diff = minTouchSize - boxH;
          boxT -= diff / 2;
          boxH = minTouchSize;
        }

        clickZone.style.display = 'block';
        clickZone.style.left = Math.round(boxL) + 'px';
        clickZone.style.top = Math.round(boxT) + 'px';
        clickZone.style.width = Math.round(boxW) + 'px';
        clickZone.style.height = Math.round(boxH) + 'px';
      }

      requestAnimationFrame(updateClickZone);

      // Gestion des clics/taps n'importe où sur l'écran qui touchent la zone
      function checkGlobalPointer(clientX, clientY, target) {
        if (target && target.closest && target.closest('.top-controls')) return;
        if (clickZone.style.display !== 'none') {
          const rect = clickZone.getBoundingClientRect();
          if (clientX >= rect.left && clientX <= rect.right &&
              clientY >= rect.top && clientY <= rect.bottom) {
            triggerBoxInteraction();
          }
        }
      }

      window.addEventListener('pointerdown', function (e) {
        checkGlobalPointer(e.clientX, e.clientY, e.target);
      }, true);

      window.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length > 0) {
          checkGlobalPointer(e.touches[0].clientX, e.touches[0].clientY, e.target);
        }
      }, { passive: true });
    });
  </script>
</head>
<body>

  <!-- Figure matérialisant la zone de clic en noir à 20% de transparence -->
  <div id="clickZoneBox" title="Zone de clic"></div>

  <div class="top-controls">
    <div class="panel">
      <strong>Exercice 3</strong> : Taper sur le cube ou la zone de clic. | 
      <span id="statusText">En attente de detection Hiro</span> | 
      <a href="../index.html">Sommaire</a>
    </div>
    <button id="btnSwitchCamera" class="btn" type="button">Changer de camera</button>
    <button id="btnZoomOut" class="btn" type="button">Zoom -</button>
    <span id="zoomLevelText" class="panel" style="padding: 6px 8px; font-weight: bold;">1.0x</span>
    <button id="btnZoomIn" class="btn" type="button">Zoom +</button>
    <button id="btnFitMode" class="btn" type="button">Cadrage : Remplir</button>
  </div>

  <!-- Scene AR sans dimensions fixes forcees pour eviter le clipping du cube sur mobile -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <!-- Boite interactive -->
      <a-box 
        id="targetBox"
        class="clickable"
        position="0 0.5 0" 
        scale="1 1 1"
        color="#e74c3c" 
        material="opacity: 0.85; transparent: true;"
        dynamic-spin="speed: 1.0">
      </a-box>
    </a-marker>

    <!-- Curseur camera associe pour le raycasting de base -->
    <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
  </a-scene>

</body>
</html>
