<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercice 1 - Scene 3D A-Frame</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .panel {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100;
      background: #ffffff;
      border: 1px solid #999;
      padding: 10px 14px;
      font-size: 13px;
      max-width: 320px;
    }
    .panel h1 {
      margin: 0 0 5px 0;
      font-size: 15px;
    }
    .panel a {
      color: #0066cc;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Exercice 1 : Scene 3D A-Frame</h1>
    <p>3 boites a hauteur 2 au-dessus du plan. Camera a (0, 10, 15) orientee vers le centre.</p>
    <a href="../index.html">Retour au sommaire</a>
  </div>

  <a-scene background="color: #222">
    <!-- Plan au sol a y = 0 -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="14" height="14" color="#444"></a-plane>

    <!-- 3 boites en levitation a 2 unites au-dessus du sol (y = 2) -->
    <a-box position="-3.5 2 -2" width="1.5" height="1.5" depth="1.5" color="#e74c3c"></a-box>
    <a-box position="0 2 0" width="1.5" height="1.5" depth="1.5" color="#2ecc71"></a-box>
    <a-box position="3.5 2 2" width="1.5" height="1.5" depth="1.5" color="#3498db"></a-box>

    <!-- Camera positionnee a y=10 et z=15, orientee vers le centre (-33.69 deg) -->
    <a-entity position="0 10 15" rotation="-33.69 0 0">
      <a-camera look-controls="enabled: true" wasd-controls="enabled: true"></a-camera>
    </a-entity>
  </a-scene>

</body>
</html>
